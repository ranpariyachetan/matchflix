<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchflix - Find Your Next Favorite Movie</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Movie Modal Dialog -->
    <div class="modal hidden" id="movieModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>

            <!-- Movie Details Section -->
            <div class="movie-details-section">
                <div class="movie-details-container">
                    <div class="movie-poster-container">
                        <div id="modalMoviePoster" class="modal-movie-poster"></div>
                    </div>
                    <div class="movie-details-info">
                        <h1 id="modalMovieTitle" class="modal-movie-title"></h1>
                        <div class="modal-movie-meta">
                            <span class="modal-movie-year" id="modalMovieYear"></span>
                        </div>
                        <p id="modalMovieDescription" class="modal-movie-description"></p>
                        <button class="watch-trailer-btn" id="watchTrailerBtn">▶ Watch Trailer</button>
                        <div class="modal-trailer hidden" id="modalTrailer">
                            <iframe
                                id="modalTrailerFrame"
                                class="modal-trailer-frame"
                                title="Movie trailer"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen
                            ></iframe>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Similar Movies Section -->
            <div class="similar-movies-section">
                <h2 class="section-title">You might also like</h2>
                <div class="movies-scroll-container">
                    <div class="movies-grid" id="modalSimilarMovies"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="netflix-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">MATCHFLIX</h1>
                <p class="tagline">Find Your Next Favorite Movie</p>
            </div>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search for a movie, genre, or mood..."
                    autocomplete="off"
                >
                <button class="search-button" id="searchBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    Search
                </button>
            </div>
        </section>

        <!-- Search Results Section -->
        <section class="search-results-section hidden" id="searchResultsSection">
            <div class="search-results-content">
                <div class="search-results-header">
                    <h2 class="section-title">Search Results</h2>
                    <button class="clear-search-btn" id="clearSearchBtn">✕ Clear</button>
                </div>
                <div class="movies-scroll-container">
                    <div class="movies-grid" id="searchResults"></div>
                </div>
            </div>
        </section>

        <!-- Featured Section -->
        <section class="featured-section">
            <h2 class="section-title">Featured Movies</h2>
            <div class="movies-scroll-container">
                <div class="movies-grid" id="featuredMovies"></div>
            </div>
        </section>

        <!-- All Movies Section -->
        <section class="all-movies-section">
            <h2 class="section-title">All Movies</h2>
            <div class="movies-scroll-container">
                <div class="movies-grid" id="allMovies"></div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 Matchflix. Powered by AI embeddings and similarity search.</p>
        </footer>
    </div>

    <script src="/movies-data.js"></script>
    <script src="/app.js"></script>
</body>
</html>
